{% extends 'base.html' %}
{% block content %}

<h3>My Applications</h3>

<table class="table table-striped">
    <tr>
        <th>Job</th>
        <th>Status</th>
        <th>Date</th>
    </tr>

    {% for app in applications %}
    <tr>
        <td>{{ app.job.title }}</td>
        <td>
            <span class="badge bg-info">{{ app.status }}</span>
        </td>
        <td>{{ app.applied_at|date:"d M Y" }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
